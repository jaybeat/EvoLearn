<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#EDE5D2"/>
  <!-- Soft moon -->
  <circle cx="640" cy="120" r="56" fill="#FFFCF0" opacity="0.95"/>
  <circle cx="660" cy="110" r="50" fill="#EDE5D2"/>
  <!-- Brain illustration silhouette -->
  <g transform="translate(280 100)">
    <ellipse cx="120" cy="140" rx="160" ry="120" fill="#7CC4F2" opacity="0.85"/>
    <path d="M -10 100 Q 30 60 80 100 Q 130 60 180 100 Q 230 60 260 110"
          stroke="#27719E" stroke-width="3" fill="none"/>
    <path d="M -10 160 Q 30 200 80 160 Q 130 200 180 160 Q 230 200 260 150"
          stroke="#27719E" stroke-width="3" fill="none"/>
    <path d="M 120 30 Q 90 130 120 240" stroke="#27719E" stroke-width="3" fill="none"/>
  </g>
  <!-- Question card -->
  <g transform="translate(80 300)">
    <rect x="0" y="0" width="160" height="100" rx="14" fill="#FFFCF0" stroke="#332b22" stroke-width="2"/>
    <text x="80" y="68" text-anchor="middle" font-family="'Young Serif', serif" font-size="56" fill="#332b22">?</text>
  </g>
  <!-- Light beam -->
  <path d="M 540 60 L 720 220 L 510 200 Z" fill="#F5B26B" opacity="0.45"/>
  <!-- Caption -->
  <text x="400" y="430" text-anchor="middle" font-family="'Young Serif', serif" font-size="24" fill="#332b22">
    学会如何学习:高效大脑手册
  </text>
</svg>
